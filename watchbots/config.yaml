fanout:
  telegram: true

mqtt:
  host: mqtt_broquer
  port: 1883
  keepalive: 60
  client_id: watchbots
  lists:
    eurotronics:
      - lzig/living heat
      - lzig/kitchen heat
      - lzig/bedroom heat
      - lzig/office heat
      - lzig/bathroom heat
    aqara:
      - lzig/bedroom window
      - lzig/kitchen window
      - lzig/office switch
      - lzig/fridge weather
      - lzig/balcony window left
      - lzig/balcony window right
      - lzig/balcony door
      - lzig/office window left
      - lzig/office window right
    shelly:
      - shellies/shellyswitch25-B8A4EE/relay/0/power
  publish: true
  subscribe: true

watch:
  aqara:
    voltage:
      minimum: 1800
      back: 2500
  eurotronics:
    battery:
      minimum: 15
      back: 30

alive_minutes_sensor:
  aqara: 165
  eurotronics: 440
  shelly: 10

log:
  logfile: /var/log/watchbots/watchbots(date).log
  exceptions_log_file: /var/log/watchbots/watchbots-exceptions.log
  level: info
